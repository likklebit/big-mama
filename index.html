<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Come On - Music Player</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .player-container {
      background: #181818;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 450px;
      text-align: center;
    }

    .song-title {
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .artist-name {
      font-size: 1rem;
      color: #b3b3b3;
      margin-bottom: 20px;
    }

    audio {
      width: 100%;
      margin-bottom: 20px;
    }

    .lyrics-container {
      height: 250px;
      overflow-y: auto;
      padding: 10px;
      border-top: 1px solid #282828;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .lyrics-container::-webkit-scrollbar {
      width: 6px;
    }

    .lyrics-container::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 3px;
    }

    .line {
      font-size: 1.1rem;
      color: #a7a7a7;
      transition: color 0.3s ease, font-weight 0.3s ease, transform 0.3s ease;
    }

    .line.active {
      color: #1db954;
      font-weight: bold;
      font-size: 1.25rem;
      transform: scale(1.02);
    }
  </style>
</head>
<body>

  <div class="player-container">
    <div class="song-title">Come On</div>
    <div class="artist-name">Mike Kayihura</div>

    <!-- Audio Player -->
    <audio id="audio" controls>
      <source src="Mike Kayihura - Come on .mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>

    <!-- Synced Lyrics Container -->
    <div id="lyrics-container" class="lyrics-container"></div>
  </div>

  <script>
    const lrcData = `[00:00.01]
[00:08.20]Yo yo yo yo

[00:22.30]Trying to be real,
[00:25.10]With the only thing, such a good thing
[00:27.50]Cause even much later,
[00:29.60]Ill be waiting for you with the right song
[00:31.90]The right song
[00:33.40]Cinderella
[00:36.20]Princess Leila, I know it’s not fair
[00:39.50]I ride through with the sirens in the back seat
[00:42.50]Siku hizi ni kama ni jailor

[00:46.30]What it do ni njyewe tuvuye show
[00:49.10]Ndashaka kumenya uracyari low
[00:52.20]Nkuzamure tujyane real slow
[00:54.40]I wanna know

[03:21.20]Shyira umutima aho mugitereko come on
[03:24.10]Ntukihebe mpari ndi available come on
[03:27.10]I wanna love you nkujyane higher come on
[03:29.50]Ndashaka mbivuge mbishyire radio come on`;

    function parseLRC(lrc) {
      const lines = lrc.split('\n');
      const result = [];
      const timeRegex = /\[(\d{2}):(\d{2})\.(\d{2})\]/;

      lines.forEach(line => {
        const match = timeRegex.exec(line);
        if (match) {
          const minutes = parseInt(match[1], 10);
          const seconds = parseInt(match[2], 10);
          const milliseconds = parseInt(match[3], 10) * 10;
          const time = minutes * 60 + seconds + milliseconds / 1000;
          const text = line.replace(timeRegex, '').trim();
          if (text.length > 0) {
            result.push({ time, text });
          }
        }
      });
      return result;
    }

    const lyrics = parseLRC(lrcData);
    const lyricsContainer = document.getElementById('lyrics-container');
    const audio = document.getElementById('audio');

    // Build DOM elements for lyrics
    lyrics.forEach((item, index) => {
      const el = document.createElement('div');
      el.classList.add('line');
      el.id = `line-${index}`;
      el.textContent = item.text;
      lyricsContainer.appendChild(el);
    });

    // Time update event listener
    audio.addEventListener('timeupdate', () => {
      const currentTime = audio.currentTime;
      let activeIndex = -1;

      for (let i = 0; i < lyrics.length; i++) {
        if (currentTime >= lyrics[i].time) {
          activeIndex = i;
        } else {
          break;
        }
      }

      lyrics.forEach((_, index) => {
        const lineEl = document.getElementById(`line-${index}`);
        if (index === activeIndex) {
          if (!lineEl.classList.contains('active')) {
            lineEl.classList.add('active');
            lineEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        } else {
          lineEl.classList.remove('active');
        }
      });
    });
  </script>

</body>
</html>
