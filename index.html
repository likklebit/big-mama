<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Frequency 💛</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
        /* ----- RESET & BASE ----- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --void: #12080a;
            --deep: #2a1013;
            --wine: #4a1c1a;
            --ember: #ff7a45;
            --ember-dim: #c9552b;
            --gold: #ffc857;
            --cream: #fff3e6;
            --muted: rgba(255, 243, 230, 0.6);
            --glass-bg: rgba(255, 180, 120, 0.06);
            --glass-border: rgba(255, 200, 150, 0.16);
            --danger: #ff5c5c;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--void);
            overflow: hidden;
        }

        /* ----- ANIMATED BACKGROUND ----- */
        .bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: linear-gradient(135deg, var(--void) 0%, var(--deep) 30%, var(--wine) 55%, var(--deep) 80%, var(--void) 100%);
            background-size: 400% 400%;
            animation: gradientShift 18s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ----- FLOATING PARTICLES (stars) ----- */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 200, 140, 0.55);
            animation: floatParticle linear infinite;
            box-shadow: 0 0 12px rgba(255, 150, 80, 0.35);
            transition: transform 0.5s ease;
        }

        @keyframes floatParticle {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
        }

        /* ----- NOTE RAIN (background floating music notes) ----- */
        .heart-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .heart-rain span {
            position: absolute;
            display: block;
            font-size: 1.6rem;
            color: var(--gold);
            animation: heartFall linear infinite;
            opacity: 0.25;
            user-select: none;
        }

        @keyframes heartFall {
            0% { transform: translateY(-10vh) rotate(0deg) scale(0.6); opacity: 0; }
            10% { opacity: 0.25; }
            90% { opacity: 0.25; }
            100% { transform: translateY(110vh) rotate(720deg) scale(1.2); opacity: 0; }
        }

        /* ----- COMMON CONTAINER GLASS STYLE ----- */
        .glass-panel {
            position: relative;
            z-index: 10;
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 200, 150, 0.04) inset;
            text-align: center;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ----- 1. LOCK SCREEN ----- */
        #lock-screen {
            max-width: 420px;
            width: 92%;
            padding: 3.5rem 2.5rem;
            border-radius: 40px;
        }

        .lock-heart {
            font-size: 2.8rem;
            margin-bottom: 1.4rem;
            animation: pulse 1.8s infinite;
            display: inline-block;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); filter: drop-shadow(0 0 15px rgba(255, 122, 69, 0.6)); }
            100% { transform: scale(1); }
        }

        .glass-panel h1 {
            font-family: 'Fraunces', serif;
            font-style: italic;
            font-weight: 600;
            font-size: 2.3rem;
            color: var(--cream);
            margin-bottom: 1.6rem;
            text-shadow: 0 0 30px rgba(255, 150, 80, 0.25);
        }

        /* ----- TUNING DIAL (lock-screen signature element) ----- */
        .freq-dial {
            position: relative;
            height: 30px;
            border-radius: 20px;
            background-image: repeating-linear-gradient(90deg, rgba(255, 200, 150, 0.18) 0 2px, transparent 2px 10px);
            background-color: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--glass-border);
            margin-bottom: 0.7rem;
            overflow: hidden;
        }

        .freq-dial .dial-needle {
            position: absolute;
            top: 3px;
            bottom: 3px;
            width: 3px;
            border-radius: 2px;
            background: var(--ember);
            box-shadow: 0 0 10px var(--ember);
            animation: seekFreq 4.5s ease-in-out infinite;
        }

        @keyframes seekFreq {
            0%, 100% { left: 8%; }
            50% { left: 88%; }
        }

        .dial-readout {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 2.5px;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: 1.3rem;
            opacity: 0.85;
        }

        .lock-input-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .lock-input {
            width: 100%;
            padding: 14px 20px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            color: var(--cream);
            font-family: 'IBM Plex Mono', monospace;
            letter-spacing: 3px;
            font-size: 1.05rem;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
        }

        .lock-input::placeholder {
            letter-spacing: normal;
            font-family: 'Space Grotesk', sans-serif;
            color: rgba(255, 243, 230, 0.35);
        }

        .lock-input:focus {
            border-color: var(--ember);
            box-shadow: 0 0 15px rgba(255, 122, 69, 0.35);
            background: rgba(0, 0, 0, 0.35);
        }

        .cosmic-btn {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            padding: 12px 34px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--ember), var(--ember-dim));
            color: #2a1208;
            border: 1px solid rgba(255, 190, 140, 0.4);
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .cosmic-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
            box-shadow: 0 10px 30px rgba(255, 122, 69, 0.4);
        }

        .error-message {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
            font-weight: 600;
        }

        /* ----- 2. INTERMEDIATE PAGE (SPECIAL DELIVERY) ----- */
        #delivery-screen {
            display: none;
            opacity: 0;
            transform: scale(0.95);
            max-width: 460px;
            width: 92%;
            padding: 4rem 2.5rem;
            border-radius: 40px;
        }

        .cosmic-envelope {
            font-size: 4.5rem;
            margin-bottom: 2rem;
            display: inline-block;
            animation: floatEnvelope 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(255, 170, 110, 0.4));
        }

        @keyframes floatEnvelope {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(3deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        #delivery-screen p {
            color: var(--muted);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        /* ----- 3. MAIN CARD ----- */
        .card {
            display: none;
            opacity: 0;
            transform: scale(0.95);
            max-width: 620px;
            width: 92%;
            padding: 3rem 2.5rem 2.5rem;
            border-radius: 48px;
            max-height: 95vh;
            overflow-y: auto;
        }

        .card::-webkit-scrollbar {
            width: 4px;
        }
        .card::-webkit-scrollbar-track {
            background: transparent;
        }
        .card::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        /* ----- HEADER ----- */
        .header {
            margin-bottom: 1.2rem;
        }

        .header .greeting {
            font-family: 'Fraunces', serif;
            font-style: italic;
            font-size: 2.7rem;
            font-weight: 600;
            color: var(--cream);
            text-shadow: 0 0 30px rgba(255, 150, 80, 0.25);
            line-height: 1.2;
        }

        .header .greeting .name {
            color: var(--gold);
            background: linear-gradient(135deg, var(--gold), var(--ember));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ----- SPOTIFY-STYLE LYRICS CONTAINER ----- */
        .lyrics-box {
            background-image:
                repeating-linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 0 1px, transparent 1px 3px),
                linear-gradient(rgba(0, 0, 0, 0.42), rgba(0, 0, 0, 0.42));
            border-radius: 28px;
            padding: 1.5rem 1.2rem;
            margin: 1.5rem 0;
            border: 1px solid rgba(255, 180, 120, 0.14);
            height: 220px;
            overflow-y: auto;
            scroll-behavior: smooth;
            text-align: center;
            position: relative;
            box-shadow: inset 0 2px 20px rgba(0, 0, 0, 0.5);
        }

        .lyrics-box::-webkit-scrollbar {
            display: none;
        }

        .lyrics-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 80px 0;
        }

        .lyric-line {
            font-family: 'IBM Plex Mono', monospace;
            color: rgba(255, 200, 150, 0.28);
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
            filter: blur(0.5px);
            user-select: none;
        }

        .lyric-line.active {
            color: var(--gold);
            font-size: 1.2rem;
            filter: blur(0);
            text-shadow: 0 0 15px rgba(255, 200, 100, 0.85), 0 0 30px rgba(255, 140, 60, 0.45);
            transform: scale(1.04);
        }

        /* ----- MUSIC PLAYER ----- */
        .music-player {
            background: rgba(0, 0, 0, 0.22);
            border: 1px solid rgba(255, 180, 120, 0.12);
            border-radius: 24px;
            padding: 12px 18px;
            margin: 1.2rem 0;
            display: flex;
            align-items: center;
            gap: 15px;
            text-align: left;
        }

        /* Tuning-dial "disc" — ticked amber knob instead of a vinyl record */
        .player-disc {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background:
                repeating-conic-gradient(from 0deg, var(--gold) 0deg 2deg, transparent 2deg 30deg),
                radial-gradient(circle at center, #3a1c12 0%, #1c0d08 75%);
            border: 2px solid rgba(255, 200, 150, 0.3);
            box-shadow: 0 4px 14px rgba(0,0,0,0.4), 0 0 18px rgba(255, 150, 60, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
        }

        .player-disc::after {
            content: '';
            width: 14px;
            height: 14px;
            background: var(--void);
            border-radius: 50%;
            border: 2px solid var(--ember);
        }

        .player-disc.playing {
            animation: spinDisc 4s linear infinite;
        }

        @keyframes spinDisc {
            100% { transform: rotate(360deg); }
        }

        .player-info {
            flex-grow: 1;
            min-width: 0;
        }

        .track-title {
            color: var(--cream);
            font-size: 0.95rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            color: var(--muted);
            font-size: 0.8rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 1px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .play-pause-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid rgba(255, 180, 120, 0.25);
            background: rgba(255, 180, 120, 0.12);
            color: var(--gold);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .play-pause-btn:hover {
            background: rgba(255, 180, 120, 0.22);
            transform: scale(1.08);
        }

        /* ----- INTERACTIVE ROW ----- */
        .interactive-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }

        .interactive-row button {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.85rem;
            padding: 12px 28px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(255, 122, 69, 0.22), rgba(255, 200, 87, 0.14));
            color: var(--cream);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 180, 120, 0.3);
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        }

        .interactive-row button:hover {
            transform: translateY(-3px) scale(1.03);
            background: linear-gradient(135deg, rgba(255, 122, 69, 0.38), rgba(255, 200, 87, 0.24));
            border-color: rgba(255, 180, 120, 0.5);
            box-shadow: 0 8px 30px rgba(255, 122, 69, 0.3);
        }

        .interactive-row button:active {
            transform: scale(0.95);
        }

        .interactive-row button .emoji {
            font-size: 1.2rem;
        }

        /* ----- GIANT VINYL DISC STYLING ----- */
        .player-disc.giant-disc {
            width: 240px;
            height: 240px;
            border-width: 6px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }

        .player-disc.giant-disc::after {
            width: 50px;
            height: 50px;
            border-width: 4px;
        }

        /* ----- FLOATING HEARTS (click spawn) ----- */
        .spawn-heart {
            position: fixed;
            pointer-events: none;
            z-index: 50;
            font-size: 2rem;
            color: var(--gold);
            animation: heartSpawn 1.8s ease-out forwards;
            user-select: none;
        }

        @keyframes heartSpawn {
            0% { transform: translate(0, 0) scale(0.4) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.6) rotate(40deg); opacity: 0; }
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 500px) {
            body {
                overflow-y: auto;
                align-items: flex-start;
                padding: 20px 0;
            }
            #lock-screen, #delivery-screen {
                padding: 2.5rem 1.5rem;
                border-radius: 32px;
            }
            #lock-screen h1, #delivery-screen h1 {
                font-size: 2rem;
            }
            .card {
                padding: 1.8rem 1.2rem 1.5rem;
                border-radius: 32px;
                max-height: none;
                overflow-y: visible;
            }
            .header .greeting {
                font-size: 2.2rem;
            }
            .lyrics-box {
                padding: 1rem 0.8rem;
                margin: 1rem 0;
                height: 190px;
            }
            .lyric-line {
                font-size: 0.95rem;
            }
            .lyric-line.active {
                font-size: 1.15rem;
            }
            .freq-dial {
                height: 26px;
            }
            .dial-readout {
                font-size: 0.62rem;
                letter-spacing: 1.5px;
            }
            .interactive-row button {
                font-size: 0.9rem;
                padding: 10px 24px;
            }
            .player-disc.giant-disc {
                width: 180px;
                height: 180px;
            }
            .player-disc.giant-disc::after {
                width: 38px;
                height: 38px;
            }
        }
    </style>
</head>

    <div class="heart-rain" id="heartRain"></div>

    <!-- LOCK SCREEN -->
    <div id="lock-screen" class="glass-panel">

        <div class="interactive-row">
            <button id="favSongBtn">

            </button>
        </div>
    </div>

    <!-- SECOND SONG CARD PAGE -->
    <div class="card glass-panel" id="songCard">
        <div style="text-align: left; margin-bottom: 1.5rem;">
            <button class="cosmic-btn" onclick="backToMain()" style="padding: 8px 20px; font-size: 0.9rem;">
                ← Back

        <div style="display: flex; justify-content: center; align-items: center; margin: 2rem 0;">
            <div class="player-disc giant-disc" id="giantPlayerDisc"></div>

        <div style="margin-top: 1.5rem; margin-bottom: 2rem;">
            <h2 id="favSongTitle" style="color: #fff; font-size: 1.8rem; font-weight: 800; margin-bottom: 5px; text-shadow: 0 0 20px rgba(255, 155, 203, 0.4);">Loading song...</h2>

        </div>

        <div style="display: flex; justify-content: center; align-items: center;">
            <button class="play-pause-btn" id="favPlayPauseBtn" onclick="toggleFavPlay()" style="width: 60px; height: 60px; font-size: 1.6rem; background: rgba(255, 107, 157, 0.2); border: 1px solid rgba(255, 107, 157, 0.4);">▶</button>

        // --- Parse LRC-formatted lyrics ([mm:ss.xx]text) into {time, text} objects ---
        function parseLRC(lrcText) {
            const timeTag = /\[(\d{2}):(\d{2}(?:\.\d+)?)\]/g;
            const lines = lrcText.split('\n');
            const result = [];
            lines.forEach(line => {
                const matches = [...line.matchAll(timeTag)];
                if (matches.length === 0) return;
                const text = line.replace(timeTag, '').trim();
                matches.forEach(m => {
                    const minutes = parseInt(m[1], 10);
                    const seconds = parseFloat(m[2]);
                    result.push({ time: minutes * 60 + seconds, text: text || '🎵' });
                });
            });
            result.sort((a, b) => a.time - b.time);
            return result;
        }

        // --- Render Synced Lyrics DOM ---
        function renderSyncedLyrics() {
            lyricsList.innerHTML = '';
            CONFIG.syncedLyrics.forEach((line, index) => {
                const div = document.createElement('div');
                div.className = 'lyric-line';
                div.textContent = line.text;

                // Click line to skip audio to that time

        // --- Audio Time Update Listener (Spotify-style Sync & Auto-scroll) ---
        bgMusic.addEventListener('timeupdate', () => {
            const currentTime = bgMusic.currentTime;

            let activeIndex = CONFIG.syncedLyrics.findIndex((line, i) => {
                const nextLineTime = CONFIG.syncedLyrics[i + 1] ? CONFIG.syncedLyrics[i + 1].time : Infinity;
                return currentTime >= line.time && currentTime < nextLineTime;
            });

            if (activeIndex !== -1 && activeIndex !== currentActiveIndex) {
                if (currentActiveIndex !== -1) {
                    const prevEl = document.getElementById(`lyric-${currentActiveIndex}`);
                    if (prevEl) prevEl.classList.remove('active');
                }

                const activeEl = document.getElementById(`lyric-${activeIndex}`);
                if (activeEl) {
                    activeEl.classList.add('active');

                    // Smoothly center the active line
                    const containerHeight = lyricsContainer.clientHeight;
                    const lineOffset = activeEl.offsetTop;
                    const lineHeight = activeEl.clientHeight;

                    lyricsContainer.scrollTop = lineOffset - (containerHeight / 2) + (lineHeight / 2);
                }

                currentActiveIndex = activeIndex;
            }
